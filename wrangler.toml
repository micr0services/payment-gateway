name = "payment-gateway"

main = "dist/worker.js"

# Runtime features
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Enable preview on workers.dev
workers_dev = true

[build]
command = "npm ci && npm run build"

# Observability Configuration
[observability]
enabled = true

# Analytics Engine for metrics and custom events
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "payment-gateway-analytics"

[env.production]
workers_dev = false
route = "payments.example.com/*"

# Production observability settings
[env.production.observability]
enabled = true

# Production Analytics Engine
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "payment-gateway-prod-analytics"