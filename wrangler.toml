name = "payment-gateway"

# If your app is Node.js (Express), it cannot run directly on Workers.
# You need to port it to a Worker-compatible framework (Hono, itty-router)
# or deploy Node.js elsewhere.
main = "dist/server.js"

# Runtime features
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Enable preview on workers.dev
workers_dev = true


[build]
command = "npm ci && npm run build"

[env.production]
workers_dev = false
route = "payments.example.com/*"