version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mpesa_postgres
    environment:
      POSTGRES_USER: mpesa_user
      POSTGRES_PASSWORD: mpesa_secure_password_123
      POSTGRES_DB: mpesa_integration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpesa_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
