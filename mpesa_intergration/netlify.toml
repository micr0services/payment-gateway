[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/callbacks/*"
  to = "/.netlify/functions/api/callbacks/:splat"
  status = 200

[functions]
  directory = "src/functions"

[dev]
  command = "npm run dev"
  port = 8888
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Database migrations
[build]
  before_build = "npx prisma migrate deploy"